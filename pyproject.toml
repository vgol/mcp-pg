[project]
name = "mcp-pg"
version = "0.1.0"
description = "A simple MCP server playground to learn how the Model Context Protocol works"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.15.0",
]

[project.scripts]
mcp-pg = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.2",
    "ty>=0.0.32",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["app/tests"]
